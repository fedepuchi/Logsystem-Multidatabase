name: CI
 
on:
  push:
    branches: [main]
 
jobs:
  # ---------------------------------------------------------------------
  # Job 1: tests — corre los 100 tests contra los cinco motores reales
  # ---------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    env:
      LOGMON_REQUIRE_ENGINES: "1"
 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logmon
          POSTGRES_PASSWORD: logmon
          POSTGRES_DB: logmon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logmon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: logmon
          MARIADB_DATABASE: logmon
          MARIADB_USER: logmon
          MARIADB_PASSWORD: logmon
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "LogMon!2022"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LogMon!2022' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
 
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Instalar dependencias
        working-directory: logmon/backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
 
      - name: Esperar a que los motores estén listos
        run: |
          echo "Los healthchecks de arriba ya bloquean hasta que cada servicio esté 'healthy'."
          echo "Si alguno no levanta, este job debe fallar más abajo (LOGMON_REQUIRE_ENGINES=1)."
 
      - name: Correr los 100 tests
        working-directory: logmon/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: logmon
          POSTGRES_PASSWORD: logmon
          POSTGRES_DB: logmon
 
          MARIADB_HOST: localhost
          MARIADB_PORT: 3306
          MARIADB_USER: logmon
          MARIADB_PASSWORD: logmon
          MARIADB_DATABASE: logmon
 
          SQLSERVER_HOST: localhost
          SQLSERVER_PORT: 1433
          SQLSERVER_USER: sa
          MSSQL_SA_PASSWORD: "LogMon!2022"
          SQLSERVER_DATABASE: logmon
 
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: logmon
 
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: "0"
        run: |
          pytest -v --tb=short
 
  # ---------------------------------------------------------------------
  # Job 2: docker — build de la imagen del backend
  # ---------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build imagen backend (x86_64)
        run: docker build -t logmon-backend:ci -f logmon/Dockerfile logmon/
 
      - name: Build imagen backend (arm64, vía QEMU)
        uses: docker/build-push-action@v6
        with:
          context: logmon
          file: logmon/Dockerfile
          platforms: linux/arm64
          push: false
 
  # ---------------------------------------------------------------------
  # Job 3: frontend — typecheck, build y tests
  # ---------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logmon/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
 
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: logmon/frontend/package-lock.json
 
      - name: Instalar dependencias
        run: npm ci
 
      - name: Typecheck
        run: npx tsc --noEmit
 
      - name: Build
        run: npx vite build
 
      - name: Tests
        run: npm test