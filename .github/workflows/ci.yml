name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # Job 1: tests — corre los 100 tests contra los cinco motores reales
  # ---------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    env:
      LOGMON_REQUIRE_ENGINES: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logmon
          POSTGRES_PASSWORD: logmon
          POSTGRES_DB: logmon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logmon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: logmon
          MYSQL_DATABASE: logmon
          MYSQL_USER: logmon
          MYSQL_PASSWORD: logmon
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "LogMon!2022"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LogMon!2022' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Esperar a que los motores estén listos
        run: |
          echo "Los healthchecks de arriba ya bloquean hasta que cada servicio esté 'healthy'."
          echo "Si alguno no levanta, este job debe fallar más abajo (LOGMON_REQUIRE_ENGINES=1)."

      - name: Correr los 100 tests
        working-directory: backend
        env:
          POSTGRES_URL: postgresql://logmon:logmon@localhost:5432/logmon
          MYSQL_URL: mysql://logmon:logmon@localhost:3306/logmon
          MSSQL_URL: mssql://sa:LogMon!2022@localhost:1433/master
          MONGO_URL: mongodb://localhost:27017/logmon
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v --tb=short

  # ---------------------------------------------------------------------
  # Job 2: docker — build de la imagen del backend
  # ---------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen backend (x86_64)
        run: docker build -t logmon-backend:ci backend/


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen backend (arm64, vía QEMU)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: false

  # ---------------------------------------------------------------------
  # Job 3: frontend — typecheck y build
  # ---------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      # Cuando Jorge Lopez monte Vitest, agregar acá:
      # - name: Tests
      #   run: npm test
