[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logmon-backend"
version = "0.1.0"
description = "Dynamic multi database log monitoring backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-ulid>=2.2",
    "aiosqlite>=0.19",
    "psycopg[binary,pool]>=3.1",
    "asyncmy>=0.2.9",
    "pymssql>=2.2.11",
    # AsyncMongoClient (la API async nativa de pymongo) es estable desde 4.13.
    "pymongo>=4.13",
    "redis>=5.0",
    "anyio>=4.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# El backend se ejecuta desde el fuente (uvicorn app.main:app con cwd en
# backend/ o en /app dentro de la imagen), así que `pip install .` sólo debe
# resolver dependencias, no empaquetar app/.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
